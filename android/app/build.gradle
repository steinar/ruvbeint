plugins { id 'com.android.application' }

android {
    namespace 'is.steinar.ruvbeint'
    compileSdk 35

    defaultConfig {
        applicationId 'is.steinar.ruvbeint'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('../keystore/ruvbeint.jks')
            storePassword 'ruvbeint'
            keyAlias 'ruvbeint'
            keyPassword 'ruvbeint'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def media3 = '1.5.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
}
